<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">

    <title>SingaporeTour - Travel with us</title>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <div class="container">
          <a class="navbar-brand text-uppercase" href="#">Singapore Tours</a>

          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Packages</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">FAQ</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <main>

        <!-- Modal -->
        <div class="modal fade" tabindex="-1" id="booking-modal">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title">Book a tour</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form action="#">
                        <div class="row g-2">
                            <div class="col-sm-6">
                                <div class="form-floating">
                                    <input type="email" type="email" class="form-control" aria-placeholder="your email">
                                    <label for="email">Email address</label>
                                </div>
        
                            </div>
        
                            <div class="col-sm-6">
                                <div class="form-floating">
                                    <select name="" id="select1" class="form-select">
                                        <option value="">MerLion Park, Garden by the Bay -$80</option>
                                        <option value="">Universal Studio, Sentosa -$90</option>
                                        <option value="">Singapore Zoo, Night Safari -$110</option>
                                    </select>
                                    <label for="select1">Pick a tour</label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                  <button type="button" class="btn btn-primary">Checkout</button>
                </div>
              </div>
            </div>
          </div>

        <!-- Caresoul -->
        <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="false">
            <div class="carousel-indicators">
              <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
              <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Slide 2"></button>
              <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
              <div class="carousel-item active c-item">
                <img src="https://www.nitworldwideholidays.com/singapore-tour-packages/img/Best-of-Singapore-Package.jpg" class="d-block w-100 c-img" alt="...">
                <div class="carousel-caption top-0 mt-4 d-none d-md-block">
                  <p class="fs-3 mt-5 text-uppercase">Discover Never End</p>
                  <h1 class="display-1 fw-bolder text-capitalize">The Singapore Tours</h1>
                  <button class="btn btn-primary px-4 py-2 fs-5 mt-5" data-bs-toggle="modal" data-bs-target="#booking-modal" >Book a tour</button>
                </div>
              </div>
              <div class="carousel-item active c-item">
                <img src="https://i0.wp.com/coveringmiles.com/wp-content/uploads/Universal-Studio-Singapore/uss-singapore-1.jpg?fit=960%2C755&ssl=1" class="d-block w-100 c-img" alt="...">
                <div class="carousel-caption d-none d-md-block">
                  <h5>Second slide label</h5>
                  <p>Some representative placeholder content for the second slide.</p>
                </div>
              </div>
              <div class="carousel-item active c-item">
                <img src="https://pohcdn.com/sites/default/files/styles/node__blog_post__bp_banner/public/hero_banner/Gardens-by-the-Bay.jpg" class="d-block w-100 c-img" alt="...">
                <div class="carousel-caption d-none d-md-block">
                  <h5>Third slide label</h5>
                  <p>Some representative placeholder content for the third slide.</p>
                </div>
              </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
              <span class="carousel-control-prev-icon"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
              <span class="carousel-control-next-icon" ></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>

          
      </main>

      <footer>

      </footer>
    
</body>
</html>
